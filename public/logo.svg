<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer subtle aura ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 4" />
  
  <!-- Interlocking Friendship Hearts / Endless Loop -->
  <g filter="url(#glow)">
    <!-- Left loop: representing one individual opening their heart -->
    <path d="M 36 28 C 24 28, 16 38, 16 50 C 16 66, 32 76, 50 86 C 68 76, 84 66, 84 50 C 84 38, 76 28, 64 28 C 55 28, 50 35, 50 35 C 50 35, 45 28, 36 28 Z" 
          fill="url(#primaryGrad)" />
          
    <!-- Core Friendship Bridge & Star of Trust -->
    <path d="M 44 46 C 44 42, 48 38, 50 42 C 52 38, 56 42, 56 46 C 56 52, 50 58, 50 58 C 50 58, 44 52, 44 46 Z" 
          fill="#ffffff" fill-opacity="0.95" />
          
    <!-- Aqua Connection Node -->
    <circle cx="50" cy="50" r="4.5" fill="#14b8a6" />
    <circle cx="50" cy="50" r="2" fill="#ffffff" />
  </g>
</svg>
